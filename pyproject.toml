[project]
name = "hushline-ambient-audio-assistant"
version = "0.1.0"
description = "Automatically pauses active system media when speech is detected and resumes playback after silence."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "cffi>=2.0.0",
    "numpy>=2.4.6",
    "pillow>=12.2.0",
    "pycparser>=3.0",
    "PySide6>=6.11.1",
    "PySide6_Addons>=6.11.1",
    "PySide6_Essentials>=6.11.1",
    "pystray>=0.19.5",
    "python-xlib>=0.33; sys_platform == 'linux'",
    "setuptools<70",
    "shiboken6>=6.11.1",
    "six>=1.17.0",
    "sounddevice>=0.5.5",
    "onnxruntime>=1.18.0",
    "winrt-Windows.Media.Control>=1.0.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=1.0.0; sys_platform == 'win32'",
]

[project.scripts]
hushline = "main:main"

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "config"]
packages = ["audio", "intelligence", "media", "ui", "ui.overlay", "ui.widgets"]
